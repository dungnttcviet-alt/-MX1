name: TongHopDMX
options:
  bundleIdPrefix: com.thanhduong
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  TongHopDMX:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: MaNguon
      - path: TaiNguyen
        excludes:
          - ThongTin.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thanhduong.v2dmx
        PRODUCT_NAME: TongHopDMX
        INFOPLIST_FILE: TaiNguyen/ThongTin.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        ENABLE_BITCODE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  TongHopDMXTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: MaNguonTests
    dependencies:
      - target: TongHopDMX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thanhduong.v2dmx.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TongHopDMX.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/TongHopDMX"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  TongHopDMX:
    build:
      targets:
        TongHopDMX: all
        TongHopDMXTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TongHopDMXTests
    archive:
      config: Release
